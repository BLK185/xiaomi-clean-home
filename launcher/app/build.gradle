plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.blk185.xiaomicleanhome'
    compileSdk 34

    defaultConfig {
        // Opt-in identity for firmware with a package-name HOME allowlist; see docs/devices/xiaomi-mitv-aetp0-dofus.md.
        applicationId providers.gradleProperty('launcherApplicationId').getOrElse('io.github.blk185.xiaomicleanhome')
        minSdk 26
        targetSdk 34
        versionCode 10002
        versionName '1.0.2'
    }

    signingConfigs {
        release {
            if (System.getenv('TVHOME_KEYSTORE')) {
                storeFile file(System.getenv('TVHOME_KEYSTORE'))
                storePassword System.getenv('TVHOME_STORE_PASSWORD')
                keyAlias System.getenv('TVHOME_KEY_ALIAS') ?: 'xiaomi-clean-home'
                keyPassword System.getenv('TVHOME_KEY_PASSWORD') ?: System.getenv('TVHOME_STORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            // R8 strips and optimises the code (AndroidX included): smaller APK, faster start on a slow TV CPU.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (System.getenv('TVHOME_KEYSTORE')) signingConfig signingConfigs.release
        }
    }

    packagingOptions {
        resources {
            // Kotlin metadata pulled in by AndroidX's dependencies. This launcher is plain Java and never reads it;
            // leaving it out saves about 14 KB of every install.
            excludes += ['kotlin/**', 'META-INF/*.version', 'META-INF/*.kotlin_module', 'DebugProbesKt.bin']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    // Test only (never in the APK): plain JVM tests for the module card validators, src/test.
    testImplementation 'junit:junit:4.13.2'
}

 tasks.withType(Test).configureEach { maxHeapSize = "192m"; maxParallelForks = 1; jvmArgs "-Djava.net.preferIPv4Stack=true" }
